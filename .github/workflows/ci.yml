name: CI

# Runs on every push (and PRs from forks) — see the DX section of the README.
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both versions come from package.json — setup-bun reads `packageManager`
      # (falling back to `engines.bun`), setup-node reads `engines.node`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # The Python reference core (examples/python-core, docs/spec.md §11 M13).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier (format check)
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: TypeScript (strict typecheck)
        run: bun run typecheck

      - name: Knip (unused files/exports/dependencies)
        run: bun run knip

      - name: Python adapter tests
        run: bun run test:python

      # TESTBED_REQUIRE_PYTHON=1: the tests that need python3 fail instead of skipping.
      - name: Tests (unit + API integration, in-memory DB)
        run: bun test
        env:
          TESTBED_REQUIRE_PYTHON: '1'

      # Boots this repo's server on a free port and runs the MCP smoke
      # (docs/testbed/verification.md §4).
      - name: MCP smoke
        run: bun run testbed:smoke

      # The same smoke with the example core py-echo on, two replicas.
      - name: MCP smoke (example cores)
        run: bun run testbed:smoke
        env:
          TESTBED_EXAMPLE_CORES: py-echo
          PY_ECHO_REPLICAS: '2'

      # UI automation (docs/testbed/verification.md §5): Chromium only.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Test 9 needs python3 (py-echo); TESTBED_REQUIRE_PYTHON=1 fails it instead of skipping.
      - name: UI tests
        run: bun run test:ui
        env:
          TESTBED_REQUIRE_PYTHON: '1'

      # A testbed that renamed the package, moved the port block and dropped
      # the sample core still passes the common tests (docs/spec.md §11 M15).
      - name: Downstream simulation
        run: bun run test:downstream

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Production build
        run: bun run build

  # Builds the Docker image, runs the MCP smoke against a container of it and
  # pushes it to GHCR — only for pushes to main, and only after the `ci` job
  # above passed (docs/testbed/architecture.md §8).
  # A testbed repository changes only IMAGE.
  image:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/hwahee/testbed-base
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The smoke runs from this checkout (its scenarios live in the repo).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # The image must pass the smoke before it is pushed. The whole port
      # block is published: the scenarios reach the data plane (40001) too.
      - name: MCP smoke against the image
        run: |
          docker run -d --name testbed -p 40000-40009:40000-40009 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 60); do
            curl -sf http://localhost:40000/api/health/ready >/dev/null && break
            sleep 1
          done
          bun run testbed:smoke --url http://localhost:40000 || { docker logs testbed; exit 1; }

      - name: Push
        run: docker push --all-tags "$IMAGE"
